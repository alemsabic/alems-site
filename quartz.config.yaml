# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: ale.ms
  pageTitleSuffix: Alem Šabić's Notizen und Quellen
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: de-DE
  baseUrl: ale.ms
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Domine
      body: JetBrains Mono
      code: Inconsolata
    colors:
      lightMode:
        light: "#e0cca6"
        lightgray: rgb(0 0 0 / 20%)
        gray: "#b8b8b8"
        darkgray: "#332E27"
        dark: "#2b2b2b"
        secondary: "#8b4840"
        tertiary: "#9c5e56"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#8fa59933"
      darkMode:
        light: "#00192b"
        lightgray: rgb(255 255 255 / 20%)
        gray: "#646464"
        darkgray: "#DBD5CB"
        dark: "#ebebec"
        secondary: "#8b4840"
        tertiary: "#9c5e56"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#8fa59933"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: ./local-plugins/github-flavored-markdown
    enabled: true
    order: 40
  - source: ./local-plugins/table-of-contents
    enabled: true
    options:
      minEntries: 4
      maxDepth: 3
      showByDefault: true
      collapseByDefault: false
    order: 50
    layout:
      position: right
      priority: 10
      display: desktop-only
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: ./local-plugins/citations
    enabled: true
    options:
      bibliographyFile: ./content/bibliography.bib
      suppressBibliography: false
      linkCitations: false
      csl: apa
      showTooltips: true
      tooltipAttribute: data-tooltip
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: false
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: ./local-plugins/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: ./local-plugins/og-image
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: ./local-plugins/folder-page
    enabled: true
  - source: ./local-plugins/tag-page
    enabled: true
  - source: ./local-plugins/explorer
    enabled: true
    layout:
      position: left
      priority: 50
      condition: not-index
  - source: ./local-plugins/graph
    enabled: true
    layout:
      position: right
      priority: 20
      condition: not-index
  - source: ./local-plugins/graph
    enabled: true
    options:
      localGraph:
        depth: -1
    layout:
      position: afterBody
      priority: 2
      condition: is-index
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: beforeBody
      priority: 1
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 30
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: ./local-plugins/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
      condition: not-index
  - source:
      repo: ./local-plugins/site-components
      name: tagline
    enabled: true
    options:
      linkText: Alem Sabics
      linkUrl: https://alemsabic.com
      text: " Notizbuch."
    layout:
      position: left
      priority: 20
      condition: not-index
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: beforeBody
      priority: -2
      condition: is-index
  - source:
      repo: ./local-plugins/site-components
      name: tagline
    enabled: true
    options:
      linkText: Alem Sabics
      linkUrl: https://alemsabic.com
      text: " Notizbuch."
    layout:
      position: beforeBody
      priority: -1
      condition: is-index
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: beforeBody
      priority: 2
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: false
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source:
      repo: ./local-plugins/site-components
      name: content-header
    enabled: true
    options:
      baseUrl: https://github.com/alemsabic/alems-notizen/blob/main
      editButtonText: Auf GitHub bearbeiten →
      showTags: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/comments"
    enabled: true
    options:
      provider: giscus
      options:
        repo: alemsabic/alems-site
        repoId: R_kgDOQg3eGw
        category: General
        categoryId: DIC_kwDOQg3eG84CzVVP
        mapping: pathname
        strict: false
        reactionsEnabled: true
        inputPosition: bottom
        lang: de
        lightTheme: light
        darkTheme: dark
        themeUrl: https://ale.ms/static/giscus
    layout:
      position: afterBody
      priority: 10
  - source: ./local-plugins/site-scripts
    enabled: true
    layout:
      position: afterBody
      priority: 90
  - source: ./local-plugins/footer
    enabled: true
    options:
      links: {}
  - source: ./local-plugins/recent-notes
    enabled: true
    options:
      limit: 10
      showTags: false
      linkToMore: false
    layout:
      position: afterBody
      priority: 5
  - source: ./local-plugins/site-index
    enabled: true
    layout:
      position: afterBody
      priority: 6
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  groups:
    toolbar:
      priority: 0
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      exclude:
        - "@quartz-community/article-title"
        - content-meta
    folder:
      exclude:
        - "@quartz-community/reader-mode"
        - "@quartz-community/comments"
      positions:
        right: []
    tag:
      exclude:
        - "@quartz-community/reader-mode"
        - "@quartz-community/comments"
      positions:
        right: []
    canvas:
      exclude:
        - "@quartz-community/comments"
    bases:
      exclude:
        - "@quartz-community/comments"
      positions:
        right: []
